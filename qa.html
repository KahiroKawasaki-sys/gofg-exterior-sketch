<!doctype html><html lang="ja"><meta charset="utf-8"><title>外構スケッチ 表示検証</title><style>body{margin:0;background:#333;color:white;font:14px sans-serif}header{height:44px;display:flex;gap:12px;align-items:center;padding:0 12px}button{height:32px}iframe{display:block;background:white;border:0}p{margin:0}</style><header><span>表示検証</span><button data-w="1024" data-h="768">iPad 横 1024×768</button><button data-w="768" data-h="1024">iPad 縦 768×1024</button><button data-w="375" data-h="812">スマホ 375×812</button><button data-w="1280" data-h="720">PC 1280×720</button><span id="size"></span></header><iframe src="/" title="検証中の外構スケッチ" width="1024" height="768"></iframe><script>const f=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{f.width=b.dataset.w;f.height=b.dataset.h;document.querySelector('#size').textContent=f.width+' × '+f.height;});</script></html>
