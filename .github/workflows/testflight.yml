name: Sign and prepare TestFlight
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 検査後にAppleへアップロードし、内部テスターへ配信
        type: boolean
        required: true
        default: false
      edition:
        description: どちらのアプリか（sketch＝外構スケッチ 2Dだけ／pro＝外構スケッチ Pro）
        type: choice
        options: [sketch, pro]
        required: true
        default: sketch
permissions:
  contents: read
concurrency:
  group: gofg-testflight-${{ inputs.edition }}
  cancel-in-progress: false
jobs:
  distribution:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check distribution validation logic
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check signing setup (names only; no values logged)
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 scripts/distribute.py --check-setup
      - run: npm ci
      - run: npm test
      - name: Build the app screens for this edition
        env:
          VITE_EDITION: ${{ inputs.edition }}
          # Pro の打ち合わせAI用の通行証（Cloudflare Access サービストークン）。未登録ならAIは使えないまま配信する
          VITE_AI_CLIENT_ID: ${{ inputs.edition == 'pro' && secrets.AI_ACCESS_CLIENT_ID || '' }}
          VITE_AI_CLIENT_SECRET: ${{ inputs.edition == 'pro' && secrets.AI_ACCESS_CLIENT_SECRET || '' }}
        run: npm run build:app
      - run: npx cap sync ios
      - name: Build, sign and verify; optionally upload
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOFG_UPLOAD: ${{ inputs.upload }}
          GOFG_EDITION: ${{ inputs.edition }}
        run: python3 scripts/distribute.py
      - name: Add the uploaded build to internal TestFlight groups
        if: inputs.upload
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GOFG_BUILD: 1.${{ github.run_number }}.${{ github.run_attempt }}
          GOFG_EDITION: ${{ inputs.edition }}
        run: python3 scripts/testflight_assign.py
