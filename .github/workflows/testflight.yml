name: Sign and prepare TestFlight
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 検査後にAppleへアップロード（本人が手動実行）
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: gofg-testflight
  cancel-in-progress: false
jobs:
  distribution:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check distribution validation logic
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check signing setup (names only; no values logged)
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 scripts/distribute.py --check-setup
      - run: npm ci
      - run: npm test
      - run: npm run build:app
      - run: npx cap sync ios
      - name: Build, sign and verify; optionally upload
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GOFG_UPLOAD: ${{ inputs.upload }}
        run: python3 scripts/distribute.py
